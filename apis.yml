name: Thyrocare
description: >-
  Thyrocare Technologies Limited is an Indian chain of diagnostic and
  preventive-care laboratories headquartered in Navi Mumbai, founded in 1996.
  Built around a centralized, highly automated laboratory model, it focuses on
  affordable preventive health checkups, thyroid and pathology testing, and
  sells through a nationwide network of DSA (Direct Selling Agent) franchise
  partners. Norwest Venture Partners invested pre-IPO, and PharmEasy (API
  Holdings) acquired a majority stake in 2021. Its partner order-booking API
  (TechSo/BTS) is gated behind the DSA program and publishes no public OpenAPI.
